{% extends "base.html" %}
{% block title %}单条诊断 - 电商评论情感分析{% endblock %}
{% block breadcrumb %}单条诊断{% endblock %}

{% block content %}
<div class="p-6 lg:p-8">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-800">单文本情感诊断</h2>
        <p class="text-slate-500 text-sm mt-1">输入单条评论文本，即刻获取情感分析报告</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Input Card -->
        <div class="lg:col-span-1">
            <div class="card bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-semibold text-slate-800 mb-4 flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-4 h-4 text-slate-500"></i> 输入文本
                </h3>
                <textarea id="diagnose-input" rows="6" placeholder="请输入待分析的评论文本..." class="w-full px-4 py-3 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none resize-none"></textarea>
                <div class="mt-3">
                    <label class="block text-xs font-medium text-slate-600 mb-1.5">业务领域</label>
                    <select id="diagnose-domain" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">
                        <option value="电商通用">电商通用</option>
                        <option value="外卖餐饮">外卖餐饮</option>
                        <option value="酒店住宿">酒店住宿</option>
                        <option value="汽车出行">汽车出行</option>
                    </select>
                </div>
                <button id="diagnose-btn" class="btn-primary w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium text-sm flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i> 运行分析预测
                </button>
            </div>
        </div>

        <!-- Result Card -->
        <div class="lg:col-span-2">
            <div id="diagnose-empty" class="card bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search" class="w-8 h-8 text-slate-400"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-700 mb-2">等待分析</h3>
                <p class="text-slate-500 text-sm">输入评论文本并点击分析按钮</p>
            </div>

            <div id="diagnose-result" class="hidden space-y-6">
                <!-- Result Cards -->
                <div class="grid grid-cols-3 gap-4">
                    <div id="result-polarity" class="card rounded-xl shadow-sm border p-5 text-center">
                        <p class="text-xs font-medium text-slate-500 uppercase mb-2">判定极性</p>
                        <p class="text-2xl font-bold" id="polarity-text">-</p>
                    </div>
                    <div class="card bg-white rounded-xl shadow-sm border border-slate-200 p-5 text-center">
                        <p class="text-xs font-medium text-slate-500 uppercase mb-2">模型置信度</p>
                        <p class="text-2xl font-bold text-blue-600" id="confidence-text">-</p>
                    </div>
                    <div class="card bg-white rounded-xl shadow-sm border border-slate-200 p-5 text-center">
                        <p class="text-xs font-medium text-slate-500 uppercase mb-2">涉及维度</p>
                        <p class="text-base font-semibold text-slate-800" id="aspects-text">-</p>
                    </div>
                </div>

                <!-- Word Segmentation -->
                <div class="card bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <h4 class="font-semibold text-slate-800 mb-3 flex items-center gap-2">
                        <i data-lucide="code-2" class="w-4 h-4 text-slate-500"></i> 文本分词结果
                    </h4>
                    <div class="bg-slate-50 rounded-lg p-4 font-mono text-sm text-slate-700 leading-relaxed" id="words-text"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('diagnose-btn').addEventListener('click', async function() {
        const text = document.getElementById('diagnose-input').value.trim();
        if (!text) return;

        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<div class="animate-spin-slow w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div> 分析中...';

        try {
            const resp = await fetch('/api/diagnose', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    domain: document.getElementById('diagnose-domain').value
                })
            });
            const data = await resp.json();

            if (data.error) throw new Error(data.error);

            document.getElementById('diagnose-empty').classList.add('hidden');
            document.getElementById('diagnose-result').classList.remove('hidden');

            // Polarity
            const polarityCard = document.getElementById('result-polarity');
            const polarityText = document.getElementById('polarity-text');
            if (data.label === '好评') {
                polarityCard.className = 'card rounded-xl shadow-sm border border-green-200 bg-green-50 p-5 text-center';
                polarityText.className = 'text-2xl font-bold text-green-600';
            } else {
                polarityCard.className = 'card rounded-xl shadow-sm border border-red-200 bg-red-50 p-5 text-center';
                polarityText.className = 'text-2xl font-bold text-red-600';
            }
            polarityText.textContent = data.label === '好评' ? '正向' : '负向';

            document.getElementById('confidence-text').textContent = (data.confidence * 100).toFixed(1) + '%';
            document.getElementById('aspects-text').textContent = data.aspects.join('，');
            document.getElementById('words-text').textContent = data.words;

        } catch (err) {
            alert('分析失败: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="play" class="w-4 h-4"></i> 运行分析预测';
            lucide.createIcons();
        }
    });

    lucide.createIcons();
</script>
{% endblock %}
